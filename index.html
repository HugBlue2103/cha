<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHA</title>
<link rel="icon" type="image/png" href="images/icone512x512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --fond-uni: #1c1e21;     
    --accent: #7CFC6E;
    --texte: #101214;
    --fond-page: #1a1b1d;
  }

  *{ box-sizing: border-box; }

  @font-face {
    font-family: 'CHA';
    src: url('polices/Cha-Regular.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html,body{
    margin:0; height:100%;
    background: var(--fond-page);
    font-family: 'CHA', sans-serif;
    color: var(--texte);
    overflow: hidden;
    cursor: url('images/click/curseur64.png') 13 11, auto !important;
    -webkit-user-select: none; 
    -moz-user-select: none;   
    -ms-user-select: none;    
    user-select: none;        
  }

  button, 
  a, 
  .touche,
  .controle-volume input[type="range"]::-webkit-slider-thumb,
  .controle-volume input[type="range"], 
  .rond-activation {
    cursor: url('images/click/curseur64_clic.png') 10 10, pointer !important;
  }

  .ecran{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    transition: opacity 0.9s ease;
  }
  .ecran.cache{
    opacity:0; pointer-events:none;
  }

  #mur{
    position:relative;
    width:100%; height:100%;
  }
  #fond{
    position:absolute; inset:0;
    background: var(--fond-uni);
    z-index:1;
  }
  .mur-grille{
    position:absolute; inset:0;
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    z-index:3;
  }
  .case-grille {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .panneau{
    position: absolute;
    inset: 0;
    background-image: url('images/plaque.png');
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    transition: transform 0.6s ease, opacity 0.6s ease;
    z-index: 2;
  }

  .panneau.tombe{
    transform: translateY(140%) rotate(6deg);
    opacity:0;
    pointer-events:none;
  }
  .panneau.halo{
    box-shadow: 0 0 0 4px rgba(255,255,255,0.9), 0 0 24px 8px rgba(255,255,255,0.6);
    animation: pulse-halo 1.4s ease-in-out infinite;
    z-index: 5;
  }
  @keyframes pulse-halo{
    0%,100%{ box-shadow: 0 0 0 4px rgba(255,255,255,0.9), 0 0 24px 8px rgba(255,255,255,0.6); }
    50%{ box-shadow: 0 0 0 4px rgba(255,255,255,0.5), 0 0 12px 4px rgba(255,255,255,0.3); }
  }
  .contenu-revele{
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.4s ease;
    z-index: 1;
    width: 100%;
    height: 100%;
    padding: 10px;
    text-align: center;
  }
  .contenu-revele.visible{
    opacity:1;
    pointer-events:auto;
  }
  .rond-activation{
    width: 76px; height: 76px;
    border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 18px rgba(124,252,110,0.6);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform 0.15s ease;
  }
  .rond-activation:hover{ transform: scale(1.06); }
  .rond-activation::after{
    content:"";
    width:0; height:0;
    border-top: 16px solid transparent;
    border-bottom: 16px solid transparent;
    border-left: 24px solid #14210f;
    margin-left: 6px;
  }
  .texte-indice{
    color: var(--accent);
    font-size: 45px;
    font-weight: 600;
    line-height:1.4;
    white-space: pre-line;
  }
  .btn-telechargement {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 18px rgba(124,252,110,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease;
    position: relative;
    text-decoration: none; 
  }
  
  .btn-telechargement:hover { 
    transform: scale(1.06); 
  }
  .btn-telechargement::before {
    content: "";
    position: absolute;
    top: 22px;
    width: 6px;
    height: 20px;
    background: #14210f;
  }

  .btn-telechargement::after {
    content: "";
    position: absolute;
    top: 36px;
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 16px solid #14210f;
  }
  .bloc-code{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%, -50%);
    z-index:5;
    display:flex; flex-direction:column; align-items:center;
    gap: 28px;
  }

  .afficheur{
    background: #2a2c2f;
    border: 3px solid #2a2c2f;
    border-radius: 6px;
    padding: 18px 34px;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
  }

  .afficheur .chiffres{
    font-size: 34px;
    letter-spacing: 12px;
    color: var(--accent);
    min-width: 220px;
    text-align:center;
  }

  .clavier{
    display:flex; gap: 16px;
  }

  .touche{
    width: 58px; height: 58px;
    border-radius: 6px;
    border: 2px solid #2a2c2f;
    background: linear-gradient(180deg, #e4e6e8, #b7bbc0);
    font-family:'CHA', sans-serif;
    font-size: 20px; font-weight: 600;
    cursor:pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .touche:active{ transform: translateY(2px); box-shadow: none; }

  .touche.erreur{ animation: secoue 0.35s; background:#e77; }
  @keyframes secoue{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    75%{ transform: translateX(6px); }
  }

  .touche.succes{
    background: var(--accent);
    box-shadow: 0 0 10px rgba(124,252,110,0.7);
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .controle-volume {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-size: 40px;
    width: 100%;
  }

  .controle-volume input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 80%;
    height: 6px;
    background: #2a2c2f;
    border-radius: 3px;
    outline: none;
  }
  .controle-volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(124,252,110,0.6);
  }


</style>
</head>
<body>

  <div id="ecran-mur" class="ecran">
    <div id="mur">

      <div id="fond"></div>

      <div class="mur-grille" id="mur-grille"></div>

      <div class="bloc-code">
        <div class="afficheur">
          <div class="chiffres" id="affichage-chiffres">_ _ _ _ _</div>
        </div>
        <div class="clavier" id="clavier"></div>
      </div>

    </div>
  </div>

  <audio id="son-dur" src="sons/clic-dur.mp3" preload="auto"></audio>
  <audio id="son-creux" src="sons/clic-creux.mp3" preload="auto"></audio>
  <audio id="son-touche" src="sons/touche.mp3" preload="auto"></audio>
  <audio id="son-erreur" src="sons/erreur.mp3" preload="auto"></audio>
  <audio id="son-succes" src="sons/succes.mp3" preload="auto"></audio>
  <audio id="musique" preload="auto" loop></audio>

  <script src="index_script_crypte.js"></script>
</body>
</html>
